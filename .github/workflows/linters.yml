name: lint

on:
  - push
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  license-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check license headers
        run: |
          set -euo pipefail
          fail=0
          check_header() {
            local expected="$1"
            local file="$2"
            if ! head -n 10 "$file" | grep -Fqi "$expected"; then
              echo "Missing license header in $file (expected: $expected)"
              fail=1
            fi
          }

          while IFS= read -r -d '' file; do
            check_header "Copyright The jattach authors" "$file"
          done < <(find src/jattach -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' -o -name '*.java' \) -print0)

          while IFS= read -r -d '' file; do
            check_header "Copyright The async-profiler authors" "$file"
          done < <(find src test -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.hpp' -o -name '*.java' \) \
            ! -path 'src/jattach/*' ! -path 'src/res/*' ! -name 'MANIFEST.MF' -print0)

          exit "$fail"
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prettier
        run: |
          npm install -g prettier@3.4.2
          make check-md
  eof-newline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: EOF newline check
        env:
          offenders_path: /tmp/eof_newline_offenders.txt
        run: |
          find . -path './.git' -prune -o -exec file --mime-type {} + | grep 'text/' | awk -F: '{print $1}' | while read -r file; do
            # Read last byte and verify it's a newline
            if [ -s "$file" ] && [ "$(tail -c1 "$file" | wc -l)" -eq 0 ]; then
              echo "$file" >> "$offenders_path"
            fi
          done
          if [ -s "$offenders_path" ]; then
            cat "$offenders_path"
            exit 1
          fi
  trailing-spaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trailing spaces check
        env:
          offenders_path: /tmp/trailing_space_offenders.txt
        run: |
          grep -rIlE --exclude-dir=.git '[[:blank:]]+$' . > "$offenders_path" || true
          if [ -s "$offenders_path" ]; then
            cat "$offenders_path"
            exit 1
          fi
